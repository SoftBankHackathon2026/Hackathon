# 로컬 개발: 파일 저장소 + 로컬 opa CLI + 로그 알림. `python -m agent run --config dev/agent.dev.yaml --no-slack`
job_id: forward_001
target_env: dev
store:
  kind: file
  file: {path: target.json}
scope: {allowed_keys: [DB_HOST, DB_PORT], secret_keys: [DB_PASSWORD], table: orders}
plan:
  source: onprem
  target: aws
  approved_locations: [ap-northeast-2]
  limits: {evidence_ttl_seconds: 300, write_wait_max_seconds: 30}
  target_db: {host: 127.0.0.1, port: 5432}
  remediation: {auto_apply: true}
evidence_extra: evidence_extra.json
opa: {policy_dir: ../../policies}
codex: {bin: codex, model: null, timeout_seconds: 300, max_attempts: 2}
state_dir: ../state
