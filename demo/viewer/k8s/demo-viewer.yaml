# 3분할 뷰어 GKE 배포 (oneaction-dev).
# 설정은 이미지에 없다. ConfigMap 은 저장소의 config.demo.json 으로 만든다:
#   kubectl -n demo-viewer create configmap demo-viewer-config \
#     --from-file=config.json=demo/viewer/config.demo.json \
#     --dry-run=client -o yaml | kubectl apply -f -
# 서버가 요청마다 설정을 다시 읽으므로 ConfigMap 을 고치면 재시작 없이 반영된다
# (kubelet 동기화까지 최대 1분 남짓). subPath 로 올리면 갱신이 안 되니 폴더로 올린다.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-viewer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-viewer
  namespace: demo-viewer
  labels: {app: demo-viewer}
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo-viewer}
  template:
    metadata:
      labels: {app: demo-viewer}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: viewer
          image: asia-northeast3-docker.pkg.dev/ghost-project-513812/ghost/demo-viewer:50b028afe540721adbe09c38833798151098d455
          ports: [{name: http, containerPort: 5050}]
          env:
            - {name: PORT, value: "5050"}
            - {name: VIEWER_CONFIG, value: /config/config.json}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: demo-viewer-config}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-viewer
  namespace: demo-viewer
  labels: {app: demo-viewer}
spec:
  type: LoadBalancer
  selector: {app: demo-viewer}
  ports:
    - {name: http, port: 80, targetPort: http}
