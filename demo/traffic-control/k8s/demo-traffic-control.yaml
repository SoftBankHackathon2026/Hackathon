# 데모 트래픽 제어 서버 GKE 배포 (oneaction-dev). 설계: ../DESIGN.md
# 키는 이미지·저장소에 없다. 운영자가 Secret 을 먼저 만든다(각 32자 이상, 서로 다르게):
#   kubectl -n demo-traffic-control create secret generic demo-traffic-control-keys \
#     --from-file=operator_key=/secure/operator_key --from-file=agent_key=/secure/agent_key
# agent_key 는 온프렘 Secret(gitops apps/demo-traffic-agent)에도 같은 값으로 넣는다.
# 복제본은 1개여야 한다 — 명령 대기열과 nonce 를 메모리에 둔다.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-traffic-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-traffic-control
  namespace: demo-traffic-control
  labels: {app: demo-traffic-control}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: demo-traffic-control}
  template:
    metadata:
      labels: {app: demo-traffic-control}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: asia-northeast3-docker.pkg.dev/ghost-project-513812/ghost/demo-traffic-control:IMAGE_TAG
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: OPERATOR_KEY
              valueFrom:
                secretKeyRef: {name: demo-traffic-control-keys, key: operator_key}
            - name: AGENT_KEY
              valueFrom:
                secretKeyRef: {name: demo-traffic-control-keys, key: agent_key}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-traffic-control
  namespace: demo-traffic-control
spec:
  type: LoadBalancer
  selector: {app: demo-traffic-control}
  ports:
    - {name: http, port: 80, targetPort: http}
