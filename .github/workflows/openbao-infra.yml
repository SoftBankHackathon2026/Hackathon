name: openbao-infra

on:
  pull_request:
    paths: ["migration/**", ".github/workflows/openbao-infra.yml"]
  push:
    branches: [main]
    paths: ["migration/**", ".github/workflows/openbao-infra.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install '.[dev,openbao-infra]' build 'setuptools>=69' wheel ruff==0.17.4
      - name: Static checks
        run: ruff check --isolated --select E9,F,I migration/openbao_infra tests/openbao_infra
      - name: Unit, contract, Ansible syntax and existing migration tests
        run: python -m pytest -m 'not openbao_live' -ra
      - name: Fetch fixed local-test OpenBao
        run: |
          mkdir -p "$RUNNER_TEMP/openbao"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/openbao/archive.tar.gz" https://github.com/openbao/openbao/releases/download/v2.7.2/openbao_2.7.2_linux_amd64.tar.gz
          echo "582b1f3c2fdc5afd443b2d57a225ef654de75adea609fdb66731fd582a9cbc96  $RUNNER_TEMP/openbao/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/openbao/archive.tar.gz" -C "$RUNNER_TEMP/openbao"
      - name: Real local TLS static-seal and authentication test
        run: OPENBAO_TEST_BINARY="$RUNNER_TEMP/openbao/bao" python -m pytest tests/openbao_infra/test_live.py -ra
      - name: Build and inspect package assets
        run: |
          python -m build --no-isolation
          python -c 'from pathlib import Path; import zipfile; z=zipfile.ZipFile(next(Path("dist").glob("*.whl"))); assert "migration/openbao_infra/ansible/playbooks/install.yml" in z.namelist(); assert "migration/openbao_infra/ansible/templates/openbao.hcl.j2" in z.namelist(); assert not any("__pycache__" in p for p in z.namelist())'
