# crosscloud/ (AWS↔GCP 이전 도구) 의 단위 시험·커버리지·스타일 검사.
# 실클라우드 시험은 수동 실행이라 여기서 돌리지 않는다.
name: crosscloud
on:
  pull_request:
    paths:
      - 'crosscloud/**'
      - '.github/workflows/crosscloud.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crosscloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # datapath 통합 시험용 PostgreSQL. pg_dump·psql 은 이 서비스 컨테이너 안의
    # 것을 쓴다 — 서버와 주 버전이 같아야 하고(pg_client.require_versions),
    # 러너에 깔린 도구의 버전은 이미지마다 다르다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: crosscloud
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package and dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint (ruff, Google pyguide 대응)
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Check PostgreSQL tool versions and enable statement logging
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        # 서버 로그 카나리 시험이 역할 문장을 볼 수 있게 모든 문장을 남긴다.
        run: |
          server="$(docker exec "${PG_CONTAINER}" psql -U postgres -tAc 'SHOW server_version_num')"
          dump="$(docker exec "${PG_CONTAINER}" pg_dump --version)"
          echo "server ${server} / ${dump}"
          [[ "${dump}" == *"(PostgreSQL) ${server:0:2}."* ]]
          docker exec "${PG_CONTAINER}" psql -U postgres \
            -c "ALTER SYSTEM SET log_statement = 'all'" -c 'SELECT pg_reload_conf()'
      - name: Unit and PostgreSQL tests with coverage
        env:
          CROSSCLOUD_TEST_PG_DSN: host=localhost port=5432 user=postgres password=ci-only dbname=postgres sslmode=disable
          CROSSCLOUD_TEST_PG_TOOLS: docker exec -i -e PGPASSWORD -e PGSSLMODE -e PGCONNECT_TIMEOUT ${{ job.services.postgres.id }}
          CROSSCLOUD_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m pytest --cov=crosscloud --cov-report=term-missing --cov-fail-under=80
