# crosscloud/ (AWS↔GCP 이전 도구) 의 단위 시험·커버리지·스타일 검사.
# 실클라우드 시험은 수동 실행이라 여기서 돌리지 않는다.
name: crosscloud
on:
  pull_request:
    paths:
      - 'crosscloud/**'
      - '.github/workflows/crosscloud.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crosscloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # datapath 통합 시험용 PostgreSQL. 러너의 pg_dump(16)와 주 버전을 맞춘다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: crosscloud
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package and dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint (ruff, Google pyguide 대응)
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Unit and PostgreSQL tests with coverage
        env:
          CROSSCLOUD_TEST_PG_DSN: host=localhost port=5432 user=postgres password=ci-only dbname=postgres sslmode=disable
        run: |
          pg_dump --version
          python -m pytest --cov=crosscloud --cov-report=term-missing --cov-fail-under=80
