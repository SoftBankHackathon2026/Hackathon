name: secrets-migration
on:
  pull_request:
    paths: ['migration/**', '.github/workflows/secrets-migration.yml']
  push:
    branches: [main]
    paths: ['migration/**', '.github/workflows/secrets-migration.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated secret controller and local test dependencies
        run: python -m pip install -e './migration[secrets,dev]' build wheel 'setuptools>=69' ruff==0.17.4 cryptography ansible-core==2.20.11
      - name: Check dependency compatibility and source
        run: |
          python -m pip check
          ruff check --isolated --select E9,F,I migration/migration/secrets migration/tests/secrets_migration migration/migration/secrets_export migration/tests/test_secrets_export.py
          ruff format --check migration/migration/secrets migration/tests/secrets_migration migration/migration/secrets_export migration/tests/test_secrets_export.py
      - name: Fetch fixed local OpenBao
        run: |
          mkdir -p "$RUNNER_TEMP/openbao"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/openbao/archive.tar.gz" https://github.com/openbao/openbao/releases/download/v2.7.2/openbao_2.7.2_linux_amd64.tar.gz
          echo "582b1f3c2fdc5afd443b2d57a225ef654de75adea609fdb66731fd582a9cbc96  $RUNNER_TEMP/openbao/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/openbao/archive.tar.gz" -C "$RUNNER_TEMP/openbao"
      - name: Test AWS SDK rules, pinned identity PR, TLS OpenBao and PostgreSQL rotation
        env:
          OPENBAO_TEST_BINARY: ${{ runner.temp }}/openbao/bao
          MIGRATION_TEST_DSN: postgresql://postgres:local-test-password@127.0.0.1:5432/postgres
          IDENTITY_REFERENCE_ROOT: ${{ github.workspace }}
        run: python -m pytest migration/tests/secrets_migration migration/tests/test_secrets_export.py --tb=short -ra
      - name: Build and verify package and independent entry point
        working-directory: migration
        run: |
          python -m migration.secrets --help
          python -m migration.secrets_export --help
          python -m build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('dist').glob('*.whl'))) as z:
              files = set(z.namelist())
              assert 'migration/secrets/__main__.py' in files
              assert 'migration/secrets/operations/postgres.py' in files
              assert 'migration/secrets/README.md' in files
              assert 'migration/secrets_export/__main__.py' in files
              assert 'migration/openbao_infra/ansible/playbooks/install.yml' in files
              assert not any('__pycache__' in name for name in files)
          PY
