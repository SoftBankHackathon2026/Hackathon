name: migration-connection

on:
  pull_request:
    paths:
      - "migration/connection/**"
      - "platform/backend/**"
      - ".github/workflows/migration-connection.yml"
  push:
    branches: [main]
    paths:
      - "migration/connection/**"
      - "platform/backend/**"
      - ".github/workflows/migration-connection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: connection control tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: connection_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: connection_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U connection_test -d connection_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONNECTION_TEST_POSTGRES_DSN: postgresql://connection_test:ephemeral_ci_only@127.0.0.1:5432/connection_test
      CONNECTION_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.21"
          python-version: "3.12"
      - run: uv sync --frozen --project platform/backend --extra aws
      - run: >-
          uv run --frozen --project platform/backend --extra aws
          --with-editable migration/connection --with "redis>=5,<7"
          python -m pytest -q migration/connection/tests
