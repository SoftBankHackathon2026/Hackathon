# platform/ 아래 이미지 2개(oneport-platform-api, oneport-platform-web)를 빌드해 GHCR에 올린다.
#
# - push to main (platform/** 변경)  : 빌드 + push (태그: <full sha>, main)
# - pull_request (platform/** 변경)  : 빌드만 수행, push 없음
# - workflow_dispatch               : 수동 실행 (main 외 브랜치에서는 sha 태그만 push)
#
# EKS 배포(platform/deploy/aws)는 이 워크플로가 하지 않는다. 태그 교체는 사람이 kustomization 에서 정한다.
# 패키지를 처음 올린 뒤 GitHub 패키지 설정에서 공개(public)로 바꿔야 EKS·k3s 가 pull secret 없이 받는다.
name: platform-images

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/platform-images.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-images.yml"
  workflow_dispatch:

concurrency:
  group: platform-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: softbankhackathon2026

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: oneport-platform-api
            context: platform/backend
            file: platform/backend/Dockerfile
          - image: oneport-platform-web
            context: platform/frontend
            file: platform/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "pushed: ${{ github.event_name != 'pull_request' }}"
          } >> "$GITHUB_STEP_SUMMARY"
