name: Platform CI

on:
  pull_request:
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]
  push:
    branches: [main]
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Platform API and provider workers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oneport_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: oneport_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oneport_test -d oneport_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONEPORT_TEST_DATABASE_URL: postgresql://oneport_test:ephemeral_ci_only@127.0.0.1:5432/oneport_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.21"
          python-version: "3.12"
      - run: uv sync --frozen --project platform/backend --extra aws
      - run: uv run --frozen --project platform/backend --extra aws ruff check platform/backend
      - run: uv run --frozen --project platform/backend --extra aws ruff format --check platform/backend
      - run: uv run --frozen --project platform/backend --extra aws pytest -q platform/backend/tests
      - run: uv build --project platform/backend

  frontend:
    name: Platform React build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
