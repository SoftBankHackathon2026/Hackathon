[project]
name = "oneport-controlplane"
version = "0.1.0"
description = "Oneport platform API and on-prem Argo deployment adapter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.27,<1",
  "kubernetes>=35,<36",
  "google-cloud-run==0.16.1",
  "google-auth[requests]==2.59.1",
  "pydantic-settings>=2.6,<3",
]
[project.optional-dependencies]
aws = ["boto3>=1.43,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/controlplane", "src/oneport_aws"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
