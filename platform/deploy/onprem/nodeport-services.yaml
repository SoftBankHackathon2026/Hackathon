# AWS 에 있는 플랫폼 수집기가 Tailscale 로 온프렘 워커·Connect 상태를 읽도록 노드 포트로 연다.
# 기존 ClusterIP 서비스(db-insert-worker, migration-connect)는 그대로 두고 별도 서비스를 추가한다.
# 수집기는 GET /status, GET /connectors/<job>-(source|sink)/status 만 쓴다.
# 노드 포트는 LAN(172.30.1.0/24)과 그 경로를 받은 tailnet 에서만 닿는다. 공유기에서 외부로 열지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: db-insert-worker-external
  namespace: hackathon
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: db-insert-worker
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30880}
---
apiVersion: v1
kind: Service
metadata:
  name: migration-connect-external
  namespace: hackathon
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: migration-connect
  ports:
    - {name: http, port: 8083, targetPort: http, nodePort: 30883}
