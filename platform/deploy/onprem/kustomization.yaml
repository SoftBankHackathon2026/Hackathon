# 온프렘 gitops 에 넣을 조각. 이 폴더를 그대로 Argo CD 앱으로 쓰지 않는다.
# 현재 배포/보고기 실행은 gitops apps/live-db-cutover/runner.yaml이 담당한다.
# reporter-sidecar.patch.yaml은 삭제된 db-insert-worker용 과거 예제로 적용하지 않는다.
# 아래는 fleet_reporter.py ConfigMap 생성 검증용이다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hackathon
configMapGenerator:
  - name: oneport-fleet-reporter
    files: [fleet_reporter.py]
    options:
      disableNameSuffixHash: true
