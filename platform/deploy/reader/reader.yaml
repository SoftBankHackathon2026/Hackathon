# 플랫폼 밖 클러스터(GKE 등)에 두는 읽기 전용 계정. 수집기가 이 토큰으로 만든 kubeconfig 로 읽는다.
# 권한은 platform/deploy/aws/rbac.yaml 의 oneport-fleet-reader 와 같다. Secret 은 읽지 않는다.
# 장기 토큰이다. 교체할 때는 Secret oneport-reader-token 을 지웠다가 다시 만든다.
apiVersion: v1
kind: Namespace
metadata:
  name: oneport-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oneport-reader
  namespace: oneport-reader
---
apiVersion: v1
kind: Secret
metadata:
  name: oneport-reader-token
  namespace: oneport-reader
  annotations:
    kubernetes.io/service-account.name: oneport-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oneport-fleet-reader
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, resourcequotas]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [nodes, persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [argocd-cm]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [list]
  - apiGroups: [""]
    resources: [services]
    verbs: [list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles]
    verbs: [list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [list]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oneport-fleet-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oneport-fleet-reader
subjects:
  - kind: ServiceAccount
    name: oneport-reader
    namespace: oneport-reader
