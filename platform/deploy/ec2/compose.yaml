# Oneport 플랫폼 (EC2 한 대, docker compose). CD(.github/workflows/platform-ec2.yml)가 이 파일과 fleet.json 을 /opt/oneport 에 쓰고 다시 띄운다.
#   postgres          : 플랫폼 DB
#   oneport-api       : FastAPI. 화면 API, 보고기 ingest
#   oneport-collector : 수집기. 세 클러스터 모두 /opt/oneport/kube 의 읽기 전용 kubeconfig 로 읽는다
#   oneport-web       : 화면(nginx). /api 는 oneport-api 로 넘긴다
#   caddy             : 80·443. Let's Encrypt 인증서를 받아 HTTPS 로 oneport-web 에 넘기고, 80 은 HTTPS 로 돌린다
#
# 인스턴스에만 있는 파일 (Git 에 넣지 않는다, README 참고)
#   /opt/oneport/.env                  : ONEPORT_REGISTRY, ONEPORT_TAG
#   /opt/oneport/settings.env          : ONEPORT_DOMAIN, ONEPORT_AUTH_MODE, ONEPORT_ALLOWED_HOSTS, ONEPORT_ALLOWED_ORIGINS
#   /opt/oneport/secrets/              : postgres-password, database-url, ingest-token, access.env(있으면 접속 PIN)
#   /opt/oneport/kube/                 : onprem.kubeconfig, aws.kubeconfig, gcp.kubeconfig
name: oneport

x-api: &api
  image: ${ONEPORT_REGISTRY}/ghost/oneport-platform-api:${ONEPORT_TAG}
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: [/tmp]
  depends_on:
    postgres: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oneport
      POSTGRES_DB: oneport
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./secrets/postgres-password:/run/secrets/postgres-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneport -d oneport"]
      interval: 5s
      retries: 20

  oneport-api:
    <<: *api
    env_file:
      - settings.env
      - path: secrets/access.env
        required: false
    environment:
      ONEPORT_DATABASE_URL_FILE: /etc/oneport/secrets/database-url
      ONEPORT_INGEST_TOKEN_FILE: /etc/oneport/secrets/ingest-token
      ONEPORT_FLEET_CONFIG: /etc/oneport/fleet/fleet.json
    volumes:
      - ./secrets/database-url:/etc/oneport/secrets/database-url:ro
      - ./secrets/ingest-token:/etc/oneport/secrets/ingest-token:ro
      - ./fleet.json:/etc/oneport/fleet/fleet.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8320/healthz', headers={'Host': 'localhost'}))"]
      interval: 10s
      retries: 6

  oneport-collector:
    <<: *api
    command: ["python", "-m", "controlplane.execution.fleet_collector"]
    environment:
      ONEPORT_DATABASE_URL_FILE: /etc/oneport/secrets/database-url
      ONEPORT_FLEET_CONFIG: /etc/oneport/fleet/fleet.json
    volumes:
      - ./secrets/database-url:/etc/oneport/secrets/database-url:ro
      - ./kube:/etc/oneport/kube:ro
      - ./fleet.json:/etc/oneport/fleet/fleet.json:ro

  oneport-web:
    image: ${ONEPORT_REGISTRY}/ghost/oneport-platform-web:${ONEPORT_TAG}
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp, /var/cache/nginx]
    depends_on:
      oneport-api: {condition: service_healthy}

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    env_file: [settings.env]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    tmpfs: [/tmp]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - oneport-web

volumes:
  postgres:
  caddy-data:
  caddy-config:
