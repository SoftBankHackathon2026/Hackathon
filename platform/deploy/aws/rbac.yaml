# 수집기가 EKS 자신을 읽는 권한. Pod ServiceAccount 로 읽으므로 EKS access entry 가 필요 없다.
# 읽기 전용이고 Secret 은 읽지 않는다. 수집기가 보는 항목은 docs/MIGRATION-DASHBOARD.md 의 "클러스터 사실"이다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oneport-collector
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oneport-fleet-reader
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, resourcequotas]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [argocd-cm]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, deployments/status, statefulsets/status]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles]
    verbs: [list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oneport-fleet-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oneport-fleet-reader
subjects:
  - kind: ServiceAccount
    name: oneport-collector
    namespace: oneport
