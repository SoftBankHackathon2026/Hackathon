- name: Control only AWS input owned by this Wazuh manager
  hosts: wazuh_nodes
  gather_facts: false
  vars:
    wi_operation: control
  tasks:
  - ansible.builtin.import_tasks: ../tasks/cluster.yml
  - name: Start, pause or observe owned Wazuh AWS input
    wazuh_manage:
      action: control
      config: '{{ wi }}'
      digest: '{{ wi_digest }}'
      credentials: '{{ wi_credentials }}'
    no_log: true
    register: wi_task_report
    failed_when: false
  - name: Store only the module report in the private controller workspace
    wazuh_report:
      report: '{{ wi_task_report.report | default({}) }}'
      enforce: true
    no_log: true
