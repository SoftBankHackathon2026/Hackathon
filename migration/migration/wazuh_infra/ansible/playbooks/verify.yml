- name: Verify only this managed installation
  hosts: wazuh_nodes
  gather_facts: false
  vars:
    wi_operation: verify
  tasks:
  - ansible.builtin.import_tasks: ../tasks/cluster.yml
  - name: Validate storage, services, role restrictions and optional event probe
    wazuh_manage:
      action: verify
      config: '{{ wi }}'
      digest: '{{ wi_digest }}'
    no_log: true
    register: wi_task_report
    failed_when: false
  - name: Store only the module report in the private controller workspace
    wazuh_report:
      report: '{{ wi_task_report.report | default({}) }}'
      enforce: true
    no_log: true
