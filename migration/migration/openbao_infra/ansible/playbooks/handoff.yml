- name: Read cluster identity
  hosts: controllers
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - ansible.builtin.import_tasks: ../tasks/cluster.yml
- name: Operate only selected node
  hosts: openbao_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
  - name: Acquire target operation lock
    openbao_lock:
      action: acquire
      owner: '{{ ob_lock_owner }}'
  - name: Perform owned operation
    block:
    - ansible.builtin.import_tasks: ../tasks/preflight.yml
    - name: Require owned installation
      ansible.builtin.assert:
        that:
        - host_check.report.owned
        quiet: true
    - name: Prepare protected download copy and always clean target staging
      when: ob.handoff.action == 'prepare'
      block:
      - name: Prepare download bundle on target
        openbao_manage:
          action: bundle
          config: '{{ ob_remote | dict2items | rejectattr(''key'', ''equalto'', ''credentials'') | items2dict }}'
          state_dir: '{{ ob_state }}'
          credentials: '{{ ob_credentials }}'
        when: ob.handoff.action == 'prepare'
      - name: Fetch into private controller workspace
        ansible.builtin.fetch:
          src: '{{ ob_state }}/recovery-bundle.json'
          dest: '{{ ob_work }}/recovery-bundle.json'
          flat: true
        when: ob.handoff.action == 'prepare'
        no_log: true
      always:
      - name: Remove target download copy; retain operational key
        ansible.builtin.file:
          path: '{{ ob_state }}/recovery-bundle.json'
          state: absent
        when: ob.handoff.action == 'prepare'
        no_log: true
    - name: Persist acknowledged handoff evidence
      openbao_manage:
        action: ack
        config: '{{ ob_remote | dict2items | rejectattr(''key'', ''equalto'', ''credentials'') | items2dict }}'
        state_dir: '{{ ob_state }}'
        credentials: '{{ ob_credentials }}'
      when: ob.handoff.action == 'ack'
    always:
    - name: Release only own operation lock
      openbao_lock:
        action: release
        owner: '{{ ob_lock_owner }}'
