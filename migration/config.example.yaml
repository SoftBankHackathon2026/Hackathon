# 이전 도구 공통 설정 예시. 비밀번호는 절대 이 파일에 적지 않는다.
# 각 계정의 비밀번호는 아래 `password_env`에 적힌 환경변수에서 읽는다.

targets:
  onprem:
    host: postgres            # k3s 네임스페이스 hackathon 안의 기존 플랫폼 Postgres 16
    port: 5432
    dbname: migration_demo
    sslmode: require
    admin_dbname: postgres    # CREATE DATABASE 용 유지보수 DB
    users:
      admin:
        user: oneaction_admin   # 온프렘 플랫폼 Postgres 슈퍼유저 (Secret review-db-credentials)
        password_env: MIGRATION_ADMIN_PASSWORD
      app:
        user: migration_app
        password_env: MIGRATION_APP_PASSWORD
      cdc:
        user: migration_cdc
        password_env: MIGRATION_CDC_PASSWORD
      sink:
        user: migration_sink
        password_env: MIGRATION_SINK_PASSWORD
      verify:
        user: migration_verify
        password_env: MIGRATION_VERIFY_PASSWORD

  aws:
    host: CHANGE-ME.rds.amazonaws.com   # RDS PostgreSQL 16 엔드포인트 (미정)
    kind: rds                            # RDS: REPLICATION 속성 대신 rds_replication 역할 (init_db·cutover 판단 근거)
    port: 5432
    dbname: migration_demo
    sslmode: require
    admin_dbname: postgres
    users:
      admin:
        user: oneaction_admin   # oneaction-infra database 스택의 RDS 마스터 계정
        password_env: MIGRATION_AWS_ADMIN_PASSWORD
      app:
        user: migration_app
        password_env: MIGRATION_APP_PASSWORD
      cdc:
        user: migration_cdc
        password_env: MIGRATION_CDC_PASSWORD
      sink:
        user: migration_sink
        password_env: MIGRATION_SINK_PASSWORD
      verify:
        user: migration_verify
        password_env: MIGRATION_VERIFY_PASSWORD

job:
  job_id: forward_001
  source: onprem
  target: aws
  table: public.migration_demo
  # legacy loadgen/검증 CLI용 phase. HTTP 봇 요청의 불변 필드는 변경하지 않는다
  live_phase_before: onprem_live
  live_phase_after: aws_live

kafka:
  bootstrap_servers: kafka:9092       # 기존 플랫폼 Kafka 3.9.1, PLAINTEXT
  connect_url: http://migration-connect:8083
  # 커넥터 비밀번호는 Connect 의 EnvVarConfigProvider(${env:MIGRATION_*_PASSWORD})로 주입한다.
  # gitops apps/migration-cdc 가 config.providers=env 와 Secret 환경변수를 설정한다.
  # secrets_file 은 FileConfigProvider 를 쓰는 환경을 위한 선택값이며 기본 템플릿은 쓰지 않는다.
  secrets_file: /opt/kafka/secrets/migration.properties

bot:
  control_url: http://traffic-bot-control:9091
  token_env: BOT_CONTROL_TOKEN
  request_endpoint: http://durable-ingress.hackathon.svc.cluster.local/api/requests
  timeout_seconds: 15

cutover:
  state_dir: /var/lib/worker
  # 데이터 예산은 항상 총 1,000건이다(옵션 아님): seed 800 + 복제 중 봇 요청 100 + 전환 후 봇 요청 100.
  # 아래 두 값은 100 으로 고정이며 다른 값은 설정 오류다. 끝나면 원본 900건·대상 1,000건이어야 성공한다.
  min_live_rows_after_snapshot: 100
  min_rows_after_switch: 100
  offset_stable_seconds: 10
  poll_interval_seconds: 5
  # 기준점(COPYING 시작 때 원본 max(created_at)) 이전 집합을 CATCHING_UP 에서 한 번 확정하는 방식.
  # digest: 서버측 버킷 해시(행 전송 없음, 기본), rows: 행 전체 읽기. 전환 구간(DRAINING 이후)은 행을 읽지 않고 건수만 센다.
  snapshot_compare: digest
  stage_timeout_seconds: 1800

# 러너에 필수: 실제 앱 환경·DB 이름과 일치하도록 app_checks를 설정한다.
ingress:
  control_url: http://durable-ingress-control:9092   # gitops apps/durable-ingress 의 제어 Service
  token_env: INGRESS_CONTROL_TOKEN                   # 제어 API Bearer 토큰 환경변수 (선택, 값은 Secret)
  timeout_seconds: 30
  targets:            # job 의 target 이름 → 접수 서비스 INGRESS_TARGETS 의 이름
    onprem: onprem
    aws: aws_db
  app_checks:         # 큐를 이 대상으로 돌리기 전에 확인할 앱 (/readyz ok, /api/info 일치, writes_paused=false)
    onprem:
      url: http://sample-app
      database: migration_demo
      environment: onprem
    aws:
      url: http://sample-app-rds
      database: migration_demo
      environment: local  # 실제 /api/info 값과 일치시킨다
      # token_env: AWS_REQUEST_API_TOKEN   # HTTPS 대상이 Bearer 를 요구할 때

# 공개 도메인 전환. 이 절이 없으면 공용 도메인은 운영자가 옮긴다. 있으면 SWITCHING 에서 대상 쓰기·접수 큐를 연 뒤
# 플랫폼 API(/api/v1/ingest/traffic/<app>)로 공용 도메인을 대상으로 돌리고, VERIFYING 에서 다시 확인한다.
# 플랫폼 서버 Caddy 가 이 경로를 따른다 (Hackathon platform/deploy/ec2/README.md "공용 도메인 전환").
