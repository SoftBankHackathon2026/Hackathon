[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "migration"
version = "0.1.0"
description = "온프렘 PostgreSQL → AWS PostgreSQL 이전 데모 도구 (INSERT 워커, CDC 제어, 전환, 검증)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
identity-aws = ["boto3==1.43.123"]
identity-gcp = ["google-auth==2.62.1", "google-api-python-client==2.201.0"]
identity-keycloak = ["httpx==0.28.1"]
identity-k8s = ["kubernetes==35.0.0"]
identity-openstack = ["openstacksdk==4.22.0"]
identity-all = [
    "boto3==1.43.123", "google-auth==2.62.1", "google-api-python-client==2.201.0",
    "httpx==0.28.1", "kubernetes==35.0.0", "openstacksdk==4.22.0",
]

[tool.setuptools.packages.find]
include = ["migration", "migration.*"]

[tool.setuptools.package-data]
"migration.identity.rules" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "integration: 실제 PostgreSQL이 필요한 테스트 (MIGRATION_TEST_DSN 설정 시 실행)",
    "identity_live: 별도 시험 계정과 자원을 요구하는 실제 권한 시험",
]
