[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "migration"
version = "0.1.0"
description = "온프렘 PostgreSQL → AWS PostgreSQL 이전 데모 도구 (INSERT 워커, CDC 제어, 전환, 검증)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
harbor-infra = [
    "ansible-core==2.20.11",
    "kubernetes==37.0.2",
    "cryptography==50.0.2",
]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.23,<5",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["migration", "migration.*"]
exclude = ["*.__pycache__"]

[tool.setuptools.package-data]
"migration.harbor_infra" = ["ansible/ansible.cfg", "ansible/requirements.yml", "ansible/releases.json", "ansible/playbooks/*.yml", "ansible/library/*.py", "ansible/module_utils/*.py", "ansible/callback_plugins/*.py", "ansible/templates/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/*.pyc", "**/__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "integration: 실제 PostgreSQL이 필요한 테스트 (MIGRATION_TEST_DSN 설정 시 실행)",
]
