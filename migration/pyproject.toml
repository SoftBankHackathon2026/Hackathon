[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "migration"
version = "0.1.0"
description = "온프렘 PostgreSQL → AWS PostgreSQL 이전 데모 도구 (INSERT 워커, CDC 제어, 전환, 검증)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6.0,<7",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
wazuh-infra = [
    "ansible-core>=2.20,<2.21",
    "kubernetes>=37,<38",
    "cryptography>=42",
    "bcrypt>=4,<6",
]
harbor-infra = [
    "ansible-core==2.20.11",
    "kubernetes==37.0.2",
    "cryptography==50.0.2",
]
openbao-infra = [
    "ansible-core==2.20.11",
    "kubernetes==37.0.2",
    "cryptography==50.0.2",
]
keycloak-infra = [
    "ansible-core>=2.20,<2.21",
    "kubernetes>=37.0.2,<38",
    "cryptography>=42",
]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.23,<5",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["migration", "migration.*"]
exclude = ["*.__pycache__"]
namespaces = false

[tool.setuptools.package-data]
"migration.wazuh_infra" = ["ansible/**/*.py", "ansible/**/*.yml", "ansible/ansible.cfg"]
"migration.harbor_infra" = ["ansible/ansible.cfg", "ansible/requirements.yml", "ansible/releases.json", "ansible/playbooks/*.yml", "ansible/library/*.py", "ansible/module_utils/*.py", "ansible/callback_plugins/*.py", "ansible/templates/*"]
"migration.openbao_infra" = [
    "ansible/ansible.cfg",
    "ansible/releases.json",
    "ansible/library/*.py",
    "ansible/module_utils/*.py",
    "ansible/callback_plugins/*.py",
    "ansible/playbooks/*.yml",
    "ansible/tasks/*.yml",
    "ansible/templates/*.j2",
]
"migration.keycloak_infra" = ["ansible/**/*.py", "ansible/**/*.yml", "ansible/**/*.j2", "ansible/ansible.cfg"]

[tool.setuptools.exclude-package-data]
"*" = ["**/*.pyc", "**/__pycache__/*"]
"migration.keycloak_infra" = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "wazuh_live: 격리된 로컬 Wazuh indexer의 실제 처리 시험",
    "integration: 실제 PostgreSQL이 필요한 테스트 (MIGRATION_TEST_DSN 설정 시 실행)",
    "openbao_live: OPENBAO_TEST_BINARY로 제공한 실제 OpenBao 실행 파일을 사용하는 로컬 시험",
]
