server {
    listen 443 ssl;
    server_name control.test;
    ssl_certificate /run/tls/control.crt;
    ssl_certificate_key /run/tls/control.key;
    ssl_protocols TLSv1.3;
    access_log off;
    client_max_body_size 300k;
    location /api/ {
        proxy_pass http://backend:8320;
        proxy_set_header Host control.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        add_header Cache-Control no-store always;
    }
    location /releases/ {
        root /srv/release;
        autoindex off;
        try_files $uri =404;
    }
    location / { return 404; }
}
