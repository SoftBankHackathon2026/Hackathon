schema_version: 1
request_id: image-migration-001
source:
  account_id: '123456789012'
  region: ap-northeast-2
  # profile: oneport-ecr-readonly
target:
  url: https://registry.example.com:8444
  organization_id: team-ghost
  installation_id: registry-01
  project: migrated
  # project_overrides:
  #   oneport/api: isolated-api
  credentials_ref: /run/oneport/harbor-image-migration.json
