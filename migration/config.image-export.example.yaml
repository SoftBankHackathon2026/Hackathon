schema_version: 1
request_id: image-export-001
source:
  url: https://<harbor 주소>
  projects:
    - <harbor 프로젝트>
  robot:
    username: <robot 계정 이름>
    secret_ref:
      file: /run/oneport/harbor-export-robot.secret
  ca_ref: /run/oneport/harbor-ca.pem
target:
  account_id: '<계정 ID>'
  region: <리전>
  repository_prefix: onprem
  repository:
    tag_immutability: true
    scan_on_push: true
    encryption: AES256
execution:
  state_dir: /var/lib/oneport/image-export
  skopeo_version: '1.18.0'
  copy_timeout_seconds: 3600
  exclusive_write: false
