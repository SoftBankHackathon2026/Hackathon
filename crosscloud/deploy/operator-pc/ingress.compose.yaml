# 접수 큐(durable-ingress)와 Redis — 운영자 PC 예시. compose 프로젝트
# ccx-<세션>-ingress.
#
# Connect 와 다른 프로젝트로 둔다. 취소할 때 Connect 만 내려도 접수 기록
# (Redis AOF, 이름 붙은 볼륨)이 남는다. 포트는 호스트 127.0.0.1 에만 공개한다.
#
# 필요한 셸 env(값은 Secret 에서, 파일에 쓰지 않는다):
#   SESSION                세션 이름(소문자). 프로젝트 이름·라벨에 들어간다.
#   SAMPLE_APP_IMAGE       팀 sample-app 이미지 그대로. 제어 바인드·토큰을
#                          env 로 받는 커밋(4ecee72) 이후 빌드여야 한다.
#   INGRESS_CONTROL_TOKEN  제어 API Bearer 토큰.
#   INGRESS_ENV_FILE       render-handoff 가 쓴 ingress.env 경로(선택, 절대
#                          경로). 없으면 ./out/ingress.env.
#
# 트래픽 봇은 profile bot 으로만 뜬다(`--profile bot up -d traffic-bot`).
# 접수 큐 8080 으로만 보낸다. 대상 앱이 토큰을 쓰지 않아(open) 토큰이 없다.
name: ccx-${SESSION:?세션 이름}-ingress
services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    ports:
      - "127.0.0.1:6379:6379"  # ingress-drain-check 가 XINFO 로 미처리를 본다
    labels:
      com.ghost.crosscloud.session: ${SESSION}
  durable-ingress:
    image: ${SAMPLE_APP_IMAGE:?팀 sample-app 이미지 태그}
    command: [node, src/durable-ingress/server.js]
    env_file: ["${INGRESS_ENV_FILE:-./out/ingress.env}"]
    environment:
      INGRESS_CONTROL_TOKEN: ${INGRESS_CONTROL_TOKEN:?제어 토큰}
    ports:
      - "127.0.0.1:8080:8080"  # 요청 접수 API(봇·클라이언트가 여기로)
      - "127.0.0.1:9092:9092"  # 제어 API(어댑터만)
    depends_on: [redis]
    labels:
      com.ghost.crosscloud.session: ${SESSION}
  traffic-bot:
    image: ${SAMPLE_APP_IMAGE:?팀 sample-app 이미지 태그}
    profiles: [bot]
    command: [node, packages/traffic-bot/bin/traffic-bot.js]
    environment:
      BOT_BASE_URL: http://durable-ingress:8080
      # 이미지의 node 사용자 홈(볼륨 첫 마운트 때 소유권이 따라온다).
      BOT_LEDGER_DIR: /home/node/ledger
      BOT_RUN_ID: ccx_${SESSION}_bot
      BOT_PHASE: ccx_live
      BOT_RATE: "1"
    volumes: [bot-ledger:/home/node]
    depends_on: [durable-ingress]
    labels:
      com.ghost.crosscloud.session: ${SESSION}
volumes:
  redis-data:
    labels:
      com.ghost.crosscloud.session: ${SESSION}
  bot-ledger:
    labels:
      com.ghost.crosscloud.session: ${SESSION}
networks:
  default:
    labels:
      com.ghost.crosscloud.session: ${SESSION}
