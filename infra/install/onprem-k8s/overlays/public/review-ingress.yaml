apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: review-api
spec:
  ingressClassName: traefik
  rules:
    - host: review.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform
                port:
                  number: 8080
