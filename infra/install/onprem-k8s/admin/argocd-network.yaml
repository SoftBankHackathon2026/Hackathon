# Traefik → argocd-server(8080) 만 허용. 차트의 argocd-server NetworkPolicy 는 다른 Argo CD 컴포넌트만 열어 두므로
# Ingress(argo.yubin.dev) 가 동작하려면 이 정책이 필요하다. 레거시 설치 때 손으로 만든 것을 2026-11-03 IaC 로 옮겼다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-server-ingress
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
