apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hackathon-agent-cluster-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: hackathon-user
    namespace: hackathon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hackathon-agent-argoproj-view
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hackathon-agent-argoproj-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hackathon-agent-argoproj-view
subjects:
  - kind: ServiceAccount
    name: hackathon-user
    namespace: hackathon
