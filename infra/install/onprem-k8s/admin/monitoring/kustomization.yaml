# kube-prometheus-stack(CRD) 설치 뒤에 적용한다. 대시보드 JSON 은 gitops 의 복사본이다:
#   monitoring/dashboards/sample-app.json, apps/review-service/monitoring/dashboards/*.json
# Grafana 데이터소스 review-db 의 Secret 은 비밀번호가 들어가므로 bootstrap-secrets.sh 가 만든다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - servicemonitors.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-sample-app
    files:
      - dashboards/sample-app.json
    options:
      annotations:
        grafana_folder: apps
  - name: review-dashboard-platform
    files:
      - dashboards/platform-overview.json
    options:
      annotations:
        grafana_folder: platform
  - name: review-dashboard-commit-timeline
    files:
      - dashboards/commit-timeline.json
    options:
      annotations:
        grafana_folder: platform
