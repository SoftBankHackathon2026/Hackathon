apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-hackathon-deployer
  namespace: hackathon
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-hackathon-deployer
  namespace: hackathon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-hackathon-deployer
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
