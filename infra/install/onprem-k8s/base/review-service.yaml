apiVersion: v1
kind: ConfigMap
metadata:
  name: review-service
data:
  DB_HOST: postgres.hackathon.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: oneaction_review
  DB_SSLMODE: require
  KAFKA_BOOTSTRAP: kafka.hackathon.svc.cluster.local:9092
  REVIEW_LLM_MODEL: claude-sonnet-5-5
  GITHUB_CI_APP_SLUG: github-actions
  DEFAULT_TARGET: local/busan-local
  INTAKE_REPOSITORIES: SoftBankHackathon2026/sample-app
  REVIEW_API_PUBLIC_URL: http://platform.hackathon.svc.cluster.local:8080
  QDRANT_URL: http://qdrant:6333
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: oneaction-review-docs
  AWS_REGION: ap-northeast-2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-api
  template:
    metadata:
      labels:
        app: review-api
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:16.15-alpine
          command:
            - sh
            - -ec
            - |
              until pg_isready --host=postgres --port=5432 --dbname=oneaction_review --username="$DB_USERNAME"; do
                sleep 2
              done
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: review-db-credentials, key: username}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      containers:
        - name: api
          image: ghcr.io/softbankhackathon2026/review-api:743fc9a4aa4156c8e9b8e63dc08b1fe9f2349a11
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: review-service
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: review-db-credentials, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: review-db-credentials, key: password}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: ANTHROPIC_API_KEY, optional: true}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: GITHUB_TOKEN, optional: true}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: GITHUB_WEBHOOK_SECRET}
            - name: REVIEW_API_TOKEN
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: REVIEW_API_TOKEN}
            - name: ARGOCD_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: ARGOCD_WEBHOOK_TOKEN}
            - name: DEPLOY_ENVS
              value: local
            - name: APP_URLS
              value: '{"sample-app":{"local":"http://sample-app.hackathon.svc.cluster.local"}}'
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: hackathon-platform-secrets, key: MINIO_ROOT_USER}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: hackathon-platform-secrets, key: MINIO_ROOT_PASSWORD}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platform
  labels:
    app: review-api   # ServiceMonitor review-api 가 이 라벨로 고른다 (gitops api.yaml 과 동일)
spec:
  selector:
    app: review-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: review-worker
  template:
    metadata:
      labels:
        app: review-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/softbankhackathon2026/review-worker:743fc9a4aa4156c8e9b8e63dc08b1fe9f2349a11
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: review-service
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: review-db-credentials, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: review-db-credentials, key: password}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: ANTHROPIC_API_KEY, optional: true}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: GITHUB_TOKEN, optional: true}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: hackathon-platform-secrets, key: MINIO_ROOT_USER}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: hackathon-platform-secrets, key: MINIO_ROOT_PASSWORD}
          livenessProbe:
            exec:
              command: [sh, -c, "find /tmp/worker-alive -mmin -2 | grep -q ."]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {cpu: 500m, memory: 2Gi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: review-worker-metrics
  labels:
    app: review-worker   # ServiceMonitor review-worker 가 이 라벨로 고른다 (gitops worker.yaml 과 동일)
spec:
  selector:
    app: review-worker
  ports:
    - {name: metrics, port: 9100, targetPort: metrics}
---
