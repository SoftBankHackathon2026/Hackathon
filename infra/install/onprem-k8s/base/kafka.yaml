apiVersion: v1
kind: Service
metadata:
  name: kafka-controller-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka-controller
  ports:
    - name: controller
      port: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka-broker
  ports:
    - name: broker
      port: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka-broker
  ports:
    - name: broker
      port: 9092
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-controller
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: kafka-controller
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-broker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kafka-broker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-controller
spec:
  serviceName: kafka-controller-headless
  replicas: 3
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: kafka-controller
  template:
    metadata:
      labels:
        app: kafka-controller
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kafka-controller
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          command: [/bin/bash, -ec]
          args:
            - |
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              exec /etc/kafka/docker/run
          env:
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: hackathon-platform-secrets
                  key: KAFKA_CLUSTER_ID
            - name: KAFKA_PROCESS_ROLES
              value: controller
            - name: KAFKA_LISTENERS
              value: CONTROLLER://:9093
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 0@kafka-controller-0.kafka-controller-headless.hackathon.svc.cluster.local:9093,1@kafka-controller-1.kafka-controller-headless.hackathon.svc.cluster.local:9093,2@kafka-controller-2.kafka-controller-headless.hackathon.svc.cluster.local:9093
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: -Xms192m -Xmx384m
          ports:
            - name: controller
              containerPort: 9093
          startupProbe:
            tcpSocket:
              port: controller
            failureThreshold: 60
            periodSeconds: 3
          readinessProbe:
            tcpSocket:
              port: controller
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: metadata
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: metadata
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
spec:
  serviceName: kafka-headless
  replicas: 2
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kafka-broker
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          command: [/bin/bash, -ec]
          args:
            - |
              ordinal="${HOSTNAME##*-}"
              export KAFKA_NODE_ID="$((100 + ordinal))"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless.hackathon.svc.cluster.local:9092"
              exec /etc/kafka/docker/run
          env:
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: hackathon-platform-secrets
                  key: KAFKA_CLUSTER_ID
            - name: KAFKA_PROCESS_ROLES
              value: broker
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 0@kafka-controller-0.kafka-controller-headless.hackathon.svc.cluster.local:9093,1@kafka-controller-1.kafka-controller-headless.hackathon.svc.cluster.local:9093,2@kafka-controller-2.kafka-controller-headless.hackathon.svc.cluster.local:9093
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "2"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          ports:
            - name: broker
              containerPort: 9092
          startupProbe:
            tcpSocket:
              port: broker
            failureThreshold: 60
            periodSeconds: 3
          readinessProbe:
            exec:
              command: [/bin/bash, -ec, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null"]
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 640Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
