apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: object-storage
spec:
  selector:
    app: object-storage
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-storage
spec:
  serviceName: minio
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: object-storage
  template:
    metadata:
      labels:
        app: object-storage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.52
          args: [mini, -dir=/data]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hackathon-platform-secrets
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hackathon-platform-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: S3_BUCKET
              value: oneaction-review-docs
          ports:
            - name: s3
              containerPort: 8333
          startupProbe:
            tcpSocket:
              port: s3
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 3Gi
