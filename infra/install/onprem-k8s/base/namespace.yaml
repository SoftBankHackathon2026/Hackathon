apiVersion: v1
kind: Namespace
metadata:
  name: hackathon
  labels:
    environment: hackathon
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hackathon-quota
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 7Gi
    limits.cpu: "13"
    limits.memory: 18Gi
    requests.storage: 30Gi
    persistentvolumeclaims: "16"
    pods: "50"
    services: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: hackathon-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi

